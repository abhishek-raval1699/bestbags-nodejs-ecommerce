services:

   bestbags:

      build: .
      ports:
       - 3000:3000
      environment:
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASS}@mongo_Db:27017/${MONGO_DB_NAME}?authSource=admin
      - SESSION_SECRET=${SESSION_SECRET}
      networks:
        - bestbags
      depends_on:
         - mongo_Db
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:3000"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s

   mongo_Db:

     image: mongo:latest  

     ports:
      - 27017:27017      

     environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}

     volumes: 
        - bestbags:/data/db
     networks:
      - bestbags
     healthcheck:
       test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
       interval: 30s
       timeout: 10s
       retries: 3
       start_period: 40s

volumes:
  bestbags:

networks:
 bestbags:
   driver: bridge
