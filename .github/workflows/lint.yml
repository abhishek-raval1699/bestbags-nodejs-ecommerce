name: linting 

on:
    push:
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: code
              uses: actions/checkout@v7  

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
               node-version: 22
               cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install ESLint
              run: npm install --no-save eslint@9 eslint-config-standard globals
       

            - name: Create ESLint config
              run: |
                  cat > eslint.config.js <<'EOF'
                  const globals = require("globals");
        
                  module.exports = [
                    {
                      files: ["**/*.js"],
                      languageOptions: {
                        ecmaVersion: "latest",
                        sourceType: "commonjs",
                        globals: globals.node
                      }
                    }
                  ];
                  EOF
                             
            - name: Run ESLint
              run: npx eslint .    
            
