name: linting 

on:
    push:
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: code
              uses: actions/checkout@v7  

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
               node-version: 22
               cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install ESLint
              run: npm install --no-save eslint @eslint/js

            - name: Create ESLint config
              run: |
                    echo 'const js = require("@eslint/js");' > eslint.config.js
                    echo 'module.exports = [js.configs.recommended];' >> eslint.config.js

            - name: run 
              run: npx eslint .    


