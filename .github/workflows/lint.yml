name: linting 

on:
    push:
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: code
              uses: actions/checkout@v7  

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
               node-version: 18

            - name: Install dependencies
              run: npm install

            - name: Install ESLint
              run: npm install --no-save eslint@8 eslint-config-standard@17

            - name: Run ESLint
              run: npx eslint . --env node
