name: linting 

on:
    workflow_call:
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: code
              uses: actions/checkout@v7  

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
               node-version: 18

            - name: Install dependencies
              run: npm install

            - name: Run lint
              run: npm run lint
