name: deploy
on:
  workflow_call:
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: code
        uses: actions/checkout@v7

      - name: login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  

      - name: deploy
        run: docker compose up -d --build
